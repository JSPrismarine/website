name: Tests
on:
    push:
    pull_request:

jobs:
    tests:
        name: 🧪 Tests
        strategy:
            matrix:
                os: [ubuntu-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v5

            - name: 📦 Install
              uses: ./.github/common/install

            - name: 🔨 Build
              run: pnpm run build

            - name: ✅ Typecheck
              run: pnpm run typecheck

            - name: 📋 Lint
              run: pnpm run lint

            - name: 🧪 Test
              run: pnpm run test
